[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-history-purger"
version = "1.0.0"
description = "Universal automated CLI tool to inspect, analyze, and purge large historical blobs from any Git repository."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "davtoh" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
purge-history = "purge_git_history:main"
git-history-purger = "purge_git_history:main"
